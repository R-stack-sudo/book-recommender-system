<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Leafwise · Book recommendations{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}" aria-label="Leafwise home"><span class="brand-mark">L</span>leafwise</a>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Popular</a>
      <a href="{{ url_for('recommend_page') }}" {% if request.endpoint in ('recommend_page', 'recommend_books') %}aria-current="page"{% endif %}>Find your next read</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Built with collaborative filtering · 706 reader-loved titles</footer>
</body>
</html>
